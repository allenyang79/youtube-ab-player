<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube A-B 重複播放器</title>
<style>
  :root {
    --bg: #111317;
    --panel: #1b1e24;
    --panel-2: #22262e;
    --line: #2c3038;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #ff4e45;
    --a-color: #4fc3f7;
    --b-color: #ffb74d;
    --ok: #81c995;
    --warn: #fdd663;
    --err: #f28b82;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 4px 0 14px; font-weight: 600; letter-spacing: .02em; }
  h2 { font-size: 1rem; margin: 0; font-weight: 600; }

  button, input, select { font: inherit; color: inherit; }
  button {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 16px; cursor: pointer; min-height: 44px; touch-action: manipulation;
  }
  button:hover:not(:disabled) { border-color: #4a505a; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.save { border-color: var(--ok); color: var(--ok); }
  select {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px 10px; min-height: 44px;
  }

  .load-bar { display: flex; gap: 8px; margin-bottom: 12px; }
  .load-bar input {
    flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px 12px; min-height: 44px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .message { padding: 10px 12px; border-radius: var(--radius); margin-bottom: 12px; font-size: .95rem; }
  .message.error { background: rgba(242,139,130,.12); border: 1px solid var(--err); color: var(--err); }
  .message.warn  { background: rgba(253,214,99,.10); border: 1px solid var(--warn); color: var(--warn); }
  .message.info  { background: rgba(129,201,149,.10); border: 1px solid var(--ok); color: var(--ok); }

  .player-wrap {
    position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
    border-radius: var(--radius); overflow: hidden;
  }
  .player-wrap iframe, .player-wrap #player { position: absolute; inset: 0; width: 100%; height: 100%; }
  .placeholder {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: .95rem; pointer-events: none;
  }

  .panel {
    margin-top: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .edit-label { font-size: .9rem; color: var(--muted); }
  .edit-label strong { color: var(--text); font-weight: 600; }

  .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  .ab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ab-cell { display: flex; align-items: center; gap: 6px; }
  .ab-cell .mark { flex: 0 0 auto; }
  .nudge { width: 52px; padding: 0; font-size: .85rem; flex: 0 0 auto; }
  .time-input {
    width: 7.2em; min-width: 0; text-align: center; font-size: 1.05rem;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 4px; min-height: 44px;
  }
  #markA, #aNudgeMinus, #aNudgePlus { border-color: var(--a-color); color: var(--a-color); }
  #markB, #bNudgeMinus, #bNudgePlus { border-color: var(--b-color); color: var(--b-color); }
  #aInput { color: var(--a-color); }
  #bInput { color: var(--b-color); }

  .row2 { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; min-height: 44px; }
  .toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
  .speed { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .9rem; }

  .status { margin-top: 10px; color: var(--muted); font-size: .9rem; min-height: 1.5em; }
  .status.looping { color: var(--ok); }

  .shortcuts { margin-top: 8px; font-size: .85rem; color: var(--muted); }
  .shortcuts summary { cursor: pointer; padding: 4px 0; }
  .shortcuts dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 6px 0 0; }
  .shortcuts dt { text-align: right; }
  .shortcuts dd { margin: 0; }
  kbd {
    display: inline-block; min-width: 1.6em; padding: 0 5px; text-align: center;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
    background: var(--panel-2); color: var(--text); font: .8rem/1.6 ui-monospace, Menlo, Consolas, monospace;
  }
  .kb-hint { color: var(--warn); font-size: .85rem; margin-top: 6px; }

  /* 區段清單 */
  .seg-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .seg-empty { color: var(--muted); font-size: .9rem; padding: 6px 0; }
  .segment {
    display: grid; grid-template-columns: auto 1fr auto auto auto; align-items: center; gap: 10px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 6px 8px; transition: border-color .15s, background .15s;
  }
  .segment.active { border-color: var(--ok); background: rgba(129,201,149,.08); }
  .segment .play-btn { width: 44px; padding: 0; font-size: 1rem; }
  .segment.active .play-btn { background: var(--ok); border-color: var(--ok); color: #111; }
  .segment .name {
    min-width: 0; width: 100%; background: transparent; border: 1px solid transparent;
    border-radius: 8px; padding: 8px; min-height: 40px;
  }
  .segment .name:hover { border-color: var(--line); }
  .segment .range { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  .segment .range .a { color: var(--a-color); }
  .segment .range .b { color: var(--b-color); }
  .segment .loops { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .segment .loops input {
    width: 3.4em; text-align: center; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 2px; min-height: 36px;
  }
  .segment .del-btn { width: 44px; padding: 0; color: var(--muted); }
  .segment .del-btn:hover { color: var(--err); border-color: var(--err); }

  .export-box { margin-top: 12px; }
  .export-box textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px; font: .9rem/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    resize: vertical;
  }

  @media (max-width: 640px) {
    main { padding: 12px; }
    .ab-grid { grid-template-columns: 1fr; }
    .ab-cell .mark { flex: 1; }
    .time-input { flex: 0 0 6.8em; }
    .segment { grid-template-columns: auto 1fr auto; row-gap: 4px; }
    .segment .range { grid-column: 2; grid-row: 2; padding-left: 8px; }
    .segment .loops { grid-column: 3; grid-row: 2; }
    .segment .del-btn { grid-column: 3; grid-row: 1; }
  }
  @media (hover: none) { .shortcuts { display: none; } }
</style>
</head>
<body>
<main>
  <h1>YouTube A-B 重複播放器</h1>

  <form id="loadForm" class="load-bar" autocomplete="off">
    <input id="urlInput" type="text" inputmode="url" spellcheck="false"
           placeholder="貼上 YouTube 網址或 11 碼影片 ID" aria-label="YouTube 網址或影片 ID">
    <button type="submit" class="primary">載入</button>
  </form>

  <div id="message" class="message" role="alert" hidden></div>

  <div class="player-wrap">
    <div id="player"></div>
    <div id="placeholder" class="placeholder">貼上網址後按「載入」</div>
  </div>

  <section class="panel" aria-label="A-B 編輯">
    <div class="panel-head">
      <div id="editLabel" class="edit-label">編輯：<strong>新區段</strong></div>
      <label class="speed">速度
        <select id="rateSelect" aria-label="播放速度">
          <option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </label>
    </div>

    <div class="ab-grid">
      <div class="ab-cell">
        <button id="markA" class="mark" type="button" disabled>標記 A</button>
        <button id="aNudgeMinus" class="nudge" type="button" disabled aria-label="A 減 0.1 秒">−0.1</button>
        <input id="aInput" class="time-input mono" type="text" inputmode="decimal" placeholder="--:--.-" disabled aria-label="A 點時間（mm:ss.s）">
        <button id="aNudgePlus" class="nudge" type="button" disabled aria-label="A 加 0.1 秒">+0.1</button>
      </div>
      <div class="ab-cell">
        <button id="markB" class="mark" type="button" disabled>標記 B</button>
        <button id="bNudgeMinus" class="nudge" type="button" disabled aria-label="B 減 0.1 秒">−0.1</button>
        <input id="bInput" class="time-input mono" type="text" inputmode="decimal" placeholder="--:--.-" disabled aria-label="B 點時間（mm:ss.s）">
        <button id="bNudgePlus" class="nudge" type="button" disabled aria-label="B 加 0.1 秒">+0.1</button>
      </div>
    </div>

    <div class="row2">
      <button id="saveSeg" type="button" class="save" disabled>＋ 存成區段</button>
      <button id="clearAB" type="button" disabled>清除 A-B</button>
      <button id="newSeg" type="button" hidden>＋ 新區段</button>
      <span class="spacer"></span>
      <label class="toggle"><input id="loopToggle" type="checkbox" checked> 啟用循環</label>
    </div>
    <div id="status" class="status">尚未載入影片</div>

    <details class="shortcuts">
      <summary>鍵盤快捷鍵</summary>
      <dl>
        <dt><kbd>A</kbd> <kbd>B</kbd></dt><dd>標記 A / B</dd>
        <dt><kbd>Space</kbd></dt><dd>播放 / 暫停</dd>
        <dt><kbd>[</kbd> <kbd>]</kbd></dt><dd>A 點 −0.1 / +0.1 秒</dd>
        <dt><kbd>,</kbd> <kbd>.</kbd></dt><dd>B 點 −0.1 / +0.1 秒</dd>
        <dt><kbd>↑</kbd> <kbd>↓</kbd></dt><dd>上一個 / 下一個區段</dd>
      </dl>
    </details>
    <div id="kbHint" class="kb-hint" hidden>鍵盤焦點目前在影片裡，點一下頁面空白處即可使用快捷鍵。</div>
  </section>

  <section class="panel" aria-label="區段清單">
    <div class="panel-head">
      <h2 id="segTitle">區段</h2>
      <button id="exportBtn" type="button" disabled>匯出章節文案</button>
    </div>
    <ul id="segList" class="seg-list"></ul>
    <div id="segEmpty" class="seg-empty">尚無區段。標記 A、B 後按「存成區段」即可儲存並命名。「次數」設 0 為無限循環，設 N 則播 N 遍後自動接下一段。</div>

    <div id="exportBox" class="export-box" hidden>
      <textarea id="exportText" rows="8" spellcheck="false" aria-label="章節文案"></textarea>
      <div class="row2">
        <button id="copyBtn" type="button" class="save">複製</button>
        <label class="toggle"><input id="exportEnd" type="checkbox" checked> 顯示結束時間</label>
        <span class="spacer"></span>
        <button id="closeExport" type="button">關閉</button>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  'use strict';

  // ===== 常數 =====
  const POLL_MS = 100;            // 輪詢間隔
  const SEEK_COOLDOWN_MS = 350;   // seekTo 後短暫不檢查，避免 getCurrentTime 尚未更新造成連續 seek
  const MIN_SEGMENT = 0.3;        // A-B 最短長度（秒）
  const NUDGE = 0.1;              // 微調幅度（秒）
  const B_PREVIEW = 1.5;          // 微調 B 時，從 B 前幾秒開始試聽
  const ID_RE = /^[A-Za-z0-9_-]{11}$/;
  const STORE_PREFIX = 'abplayer:video:';
  const STORE_LAST = 'abplayer:last';
  const STORE_RATE = 'abplayer:rate';
  const RATES = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];

  const ERROR_TEXT = {
    2:   '影片 ID 格式不正確，請確認網址。',
    5:   '播放器發生 HTML5 錯誤，請重新整理後再試。',
    100: '找不到這部影片，可能已被刪除或設為私人。',
    101: '影片擁有者不允許在其他網站嵌入播放，請改用其他影片。',
    150: '影片擁有者不允許在其他網站嵌入播放，請改用其他影片。',
    153: '播放器無法驗證網頁來源。請用 http(s) 開啟本頁（例如本機伺服器），不要直接以 file:// 開啟。'
  };

  // ===== 狀態 =====
  const state = {
    apiReady: false,
    player: null,
    playerReady: false,
    videoId: null,
    draft: { a: null, b: null },  // 尚未存成區段的 A-B
    segments: [],                 // [{ id, name, a, b, loops }]
    activeId: null,               // 目前選中（循環 / 編輯）的區段；null = 草稿
    loopEnabled: true,
    rate: 1,
    pollTimer: null,
    seekBlockUntil: 0,
    playCount: 0                  // 目前目標已完整播完的遍數
  };

  // ===== DOM =====
  const $ = (id) => document.getElementById(id);
  const el = {
    form: $('loadForm'), input: $('urlInput'), msg: $('message'), placeholder: $('placeholder'),
    editLabel: $('editLabel'), rateSelect: $('rateSelect'),
    markA: $('markA'), markB: $('markB'), aInput: $('aInput'), bInput: $('bInput'),
    aMinus: $('aNudgeMinus'), aPlus: $('aNudgePlus'), bMinus: $('bNudgeMinus'), bPlus: $('bNudgePlus'),
    saveSeg: $('saveSeg'), clearAB: $('clearAB'), newSeg: $('newSeg'), loopToggle: $('loopToggle'),
    status: $('status'), kbHint: $('kbHint'),
    segTitle: $('segTitle'), segList: $('segList'), segEmpty: $('segEmpty'),
    exportBtn: $('exportBtn'), exportBox: $('exportBox'), exportText: $('exportText'),
    exportEnd: $('exportEnd'), copyBtn: $('copyBtn'), closeExport: $('closeExport')
  };

  // ===== 工具 =====
  function parseVideoId(raw) {
    const s = (raw || '').trim();
    if (!s) return null;
    if (ID_RE.test(s)) return s;
    let url;
    try { url = new URL(/^[a-z]+:\/\//i.test(s) ? s : 'https://' + s); }
    catch { return null; }
    const host = url.hostname.toLowerCase().replace(/^(www\.|m\.|music\.)/, '');
    let id = null;
    if (host === 'youtu.be') {
      id = url.pathname.split('/')[1];
    } else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      if (url.pathname === '/watch') {
        id = url.searchParams.get('v');
      } else {
        const m = url.pathname.match(/^\/(?:shorts|embed|live|v)\/([^/?#]+)/);
        if (m) id = m[1];
      }
    }
    return id && ID_RE.test(id) ? id : null;
  }

  function fmt(sec) {
    if (sec == null || !isFinite(sec)) return '--:--.-';
    const t = Math.max(0, Math.round(sec * 10) / 10);
    const m = Math.floor(t / 60);
    const s = t - m * 60;
    return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0');
  }

  // 接受 mm:ss.s、h:mm:ss.s、純秒數；不合法回傳 null
  function parseTime(raw) {
    const s = String(raw).trim().replace('：', ':');
    if (!s) return null;
    const num = /^\d+(\.\d+)?$/;
    if (num.test(s)) return Number(s);
    const parts = s.split(':');
    if (parts.length < 2 || parts.length > 3) return null;
    const last = parts[parts.length - 1];
    const heads = parts.slice(0, -1);
    if (!num.test(last) || !heads.every(p => /^\d+$/.test(p))) return null;
    if (Number(last) >= 60) return null;
    if (parts.length === 3 && Number(parts[1]) >= 60) return null;
    return parts.reduce((acc, p) => acc * 60 + Number(p), 0);
  }

  const round3 = (n) => Math.round(n * 1000) / 1000;
  const newId = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  function showMessage(text, type = 'error') {
    el.msg.textContent = text;
    el.msg.className = 'message ' + type;
    el.msg.hidden = false;
  }
  function clearMessage() { el.msg.hidden = true; el.msg.textContent = ''; }

  function setStatus(text, looping = false) {
    el.status.textContent = text;
    el.status.classList.toggle('looping', looping);
  }

  const usable = () => state.playerReady && !!state.videoId;
  const isPlaying = () => usable() && state.player.getPlayerState() === YT.PlayerState.PLAYING;
  function duration() {
    try { const d = state.player.getDuration(); return d > 0 ? d : Infinity; } catch { return Infinity; }
  }

  // ===== 儲存 =====
  function saveStore() {
    if (!state.videoId) return;
    try {
      localStorage.setItem(STORE_PREFIX + state.videoId,
        JSON.stringify({ videoId: state.videoId, segments: state.segments }));
    } catch {
      showMessage('無法寫入瀏覽器儲存空間（可能是無痕模式或空間已滿），區段將不會被保存。', 'warn');
    }
  }

  function loadStore(videoId) {
    try {
      const raw = localStorage.getItem(STORE_PREFIX + videoId);
      if (!raw) return [];
      const data = JSON.parse(raw);
      if (!data || !Array.isArray(data.segments)) return [];
      return data.segments
        .filter(s => s && isFinite(s.a) && isFinite(s.b) && s.b > s.a)
        .map(s => ({
          id: typeof s.id === 'string' ? s.id : newId(),
          name: typeof s.name === 'string' ? s.name : '',
          a: Number(s.a), b: Number(s.b),
          loops: Number.isInteger(s.loops) && s.loops >= 0 ? s.loops : 0
        }))
        .sort((x, y) => x.a - y.a);
    } catch { return []; }
  }

  function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

  // ===== 目標（目前編輯 / 循環的對象）=====
  function activeSegment() {
    return state.activeId ? state.segments.find(s => s.id === state.activeId) || null : null;
  }
  // 編輯對象：選中的區段，否則草稿
  function editTarget() { return activeSegment() || state.draft; }
  // 循環對象：A、B 皆有效才算
  function loopTarget() {
    const t = editTarget();
    return t.a != null && t.b != null && t.b > t.a ? t : null;
  }
  function loopActive() { return state.loopEnabled && !!loopTarget(); }

  // ===== 畫面 =====
  function renderControls() {
    const ok = usable();
    const seg = activeSegment();
    const t = editTarget();

    for (const b of [el.markA, el.markB]) b.disabled = !ok;
    el.aMinus.disabled = el.aPlus.disabled = !ok || t.a == null;
    el.bMinus.disabled = el.bPlus.disabled = !ok || t.b == null;
    el.aInput.disabled = el.bInput.disabled = !ok;
    if (document.activeElement !== el.aInput) el.aInput.value = t.a == null ? '' : fmt(t.a);
    if (document.activeElement !== el.bInput) el.bInput.value = t.b == null ? '' : fmt(t.b);

    el.saveSeg.hidden = el.clearAB.hidden = !!seg;
    el.newSeg.hidden = !seg;
    el.saveSeg.disabled = !ok || !(t.a != null && t.b != null);
    el.clearAB.disabled = !ok || (t.a == null && t.b == null);

    el.editLabel.textContent = '';
    el.editLabel.append('編輯：');
    const strong = document.createElement('strong');
    strong.textContent = seg ? `「${seg.name || '未命名'}」` : '新區段（未儲存）';
    el.editLabel.append(strong);
  }

  function segLabel(seg) {
    const i = state.segments.indexOf(seg);
    return seg.name.trim() || `區段 ${i + 1}`;
  }

  function renderSegments() {
    el.segList.textContent = '';
    el.segTitle.textContent = state.segments.length ? `區段（${state.segments.length}）` : '區段';
    el.segEmpty.hidden = state.segments.length > 0 || !state.videoId;
    el.exportBtn.disabled = state.segments.length === 0;
    if (!state.segments.length) el.exportBox.hidden = true;
    else if (!el.exportBox.hidden) el.exportText.value = buildChapterText();

    state.segments.forEach((seg, i) => {
      const li = document.createElement('li');
      li.className = 'segment' + (seg.id === state.activeId ? ' active' : '');
      li.dataset.id = seg.id;

      const play = document.createElement('button');
      play.type = 'button';
      play.className = 'play-btn';
      play.textContent = '▶';
      play.title = '播放並循環此區段';
      play.setAttribute('aria-label', `播放 ${segLabel(seg)}`);
      play.addEventListener('click', () => playSegment(seg.id));

      const name = document.createElement('input');
      name.type = 'text';
      name.className = 'name';
      name.value = seg.name;
      name.placeholder = `區段 ${i + 1}`;
      name.maxLength = 60;
      name.setAttribute('aria-label', '區段名稱');
      name.addEventListener('input', () => {
        seg.name = name.value;
        saveStore();
        if (!el.exportBox.hidden) el.exportText.value = buildChapterText();
      });
      name.addEventListener('change', () => {
        seg.name = name.value.trim() || `區段 ${i + 1}`;
        name.value = seg.name;
        saveStore();
        if (seg.id === state.activeId) { renderControls(); updateLoopStatus(); }
      });
      name.addEventListener('keydown', (e) => { if (e.key === 'Enter') name.blur(); });

      const range = document.createElement('span');
      range.className = 'range mono';
      const ra = document.createElement('span'); ra.className = 'a'; ra.textContent = fmt(seg.a);
      const rb = document.createElement('span'); rb.className = 'b'; rb.textContent = fmt(seg.b);
      range.append(ra, ' – ', rb);

      const loops = document.createElement('label');
      loops.className = 'loops';
      loops.title = '播放幾遍後自動接下一段；0 = 無限循環';
      const li_ = document.createElement('input');
      li_.type = 'number';
      li_.min = '0'; li_.max = '99'; li_.step = '1';
      li_.inputMode = 'numeric';
      li_.value = String(seg.loops);
      li_.setAttribute('aria-label', '循環次數（0 為無限）');
      li_.addEventListener('change', () => {
        let v = parseInt(li_.value, 10);
        if (!isFinite(v) || v < 0) v = 0;
        if (v > 99) v = 99;
        seg.loops = v;
        li_.value = String(v);
        saveStore();
        if (seg.id === state.activeId) updateLoopStatus();
      });
      li_.addEventListener('keydown', (e) => { if (e.key === 'Enter') li_.blur(); });
      loops.append('次數', li_);

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del-btn';
      del.textContent = '✕';
      del.title = '刪除此區段';
      del.setAttribute('aria-label', `刪除 ${segLabel(seg)}`);
      del.addEventListener('click', () => deleteSegment(seg.id));

      li.append(play, name, range, loops, del);
      el.segList.appendChild(li);
    });
  }

  function renderAll() { renderControls(); renderSegments(); updateLoopStatus(); }

  function updateLoopStatus() {
    if (!state.videoId) return setStatus('尚未載入影片');
    const seg = activeSegment();
    const target = loopTarget();
    if (!target) {
      const t = editTarget();
      if (t.a == null) return setStatus('按「標記 A」設定起點，或點選下方區段播放');
      return setStatus('已設定 A，請在想結束的位置按「標記 B」');
    }
    const label = seg ? `「${segLabel(seg)}」` : '';
    const range = `${fmt(target.a)} → ${fmt(target.b)}`;
    if (!state.loopEnabled) return setStatus(`${label}${range}，循環已關閉`);
    let count = '';
    if (seg && seg.loops > 0) count = `，第 ${Math.min(state.playCount + 1, seg.loops)}/${seg.loops} 遍`;
    else if (state.playCount) count = `，已重複 ${state.playCount} 次`;
    setStatus(`循環中 ${label}${range}${count}`, true);
  }

  // ===== 匯出章節文案 =====
  function fmtChapter(sec) {
    const t = Math.max(0, Math.floor(sec));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    const ss = String(s).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
  }

  function buildChapterText() {
    const id = state.videoId;
    const withEnd = el.exportEnd.checked;
    let title = '';
    try { title = (state.player && state.player.getVideoData().title) || ''; } catch {}
    const lines = [];
    if (title) lines.push(title);
    lines.push(`https://youtu.be/${id}`, '');
    state.segments.forEach((seg) => {
      const time = withEnd ? `${fmtChapter(seg.a)} – ${fmtChapter(seg.b)}` : fmtChapter(seg.a);
      lines.push(`${time} ${segLabel(seg)}`);
      lines.push(`https://youtu.be/${id}?t=${Math.floor(seg.a)}`, '');
    });
    return lines.join('\n').trimEnd() + '\n';
  }

  function openExport() {
    if (!state.segments.length) return;
    el.exportText.value = buildChapterText();
    el.exportBox.hidden = false;
    el.copyBtn.textContent = '複製';
  }

  async function copyExport() {
    const text = el.exportText.value;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch {
      el.exportText.focus();
      el.exportText.select();
      try { ok = document.execCommand('copy'); } catch {}
    }
    el.copyBtn.textContent = ok ? '已複製 ✓' : '請手動複製';
    setTimeout(() => { el.copyBtn.textContent = '複製'; }, 1800);
  }

  // ===== 輪詢（只在 PLAYING 時執行）=====
  function startPolling() {
    if (state.pollTimer) return;
    state.pollTimer = setInterval(poll, POLL_MS);
  }
  function stopPolling() {
    if (!state.pollTimer) return;
    clearInterval(state.pollTimer);
    state.pollTimer = null;
  }

  function poll() {
    if (!state.playerReady || !loopActive()) return;
    if (performance.now() < state.seekBlockUntil) return;
    const t = state.player.getCurrentTime();
    if (typeof t !== 'number' || !isFinite(t)) return;
    if (t >= loopTarget().b) onReachB();
  }

  function seek(sec) {
    state.seekBlockUntil = performance.now() + SEEK_COOLDOWN_MS;
    state.player.seekTo(sec, true);
  }

  // 播到 B 點：依循環次數決定跳回 A 或接下一段
  function onReachB() {
    const target = loopTarget();
    if (!target) return;
    const seg = activeSegment();
    if (seg && seg.loops > 0 && state.playCount + 1 >= seg.loops) {
      advanceToNext(seg);
      return;
    }
    state.playCount++;
    seek(target.a);
    updateLoopStatus();
  }

  function advanceToNext(seg) {
    const idx = state.segments.indexOf(seg);
    const next = state.segments[idx + 1];
    if (next) {
      playSegment(next.id);
    } else {
      seek(seg.a);
      state.player.pauseVideo();
      state.playCount = 0;
      setStatus(`「${segLabel(seg)}」已播完，後面沒有其他區段了`);
    }
  }

  // 確認目前播放的是正式影片（而非廣告）
  function isMainVideoPlaying() {
    const p = state.player;
    if (!p || typeof p.getVideoData !== 'function') return false;
    const data = p.getVideoData() || {};
    return data.video_id === state.videoId && p.getDuration() > 0;
  }

  // ===== A / B 設定（標記、微調、直接輸入共用）=====
  // 回傳 true 表示成功
  function setPoint(which, value, { preview = false } = {}) {
    const t = editTarget();
    const seg = activeSegment();
    const dur = duration();
    let v = round3(Math.min(Math.max(0, value), dur));

    if (which === 'a') {
      if (t.b != null && v > t.b - MIN_SEGMENT) {
        showMessage(`A 必須早於 B（目前 B = ${fmt(t.b)}），且區段至少 ${MIN_SEGMENT} 秒。`, 'warn');
        return false;
      }
    } else {
      if (t.a == null) { showMessage('請先標記 A。', 'warn'); return false; }
      if (v < t.a + MIN_SEGMENT) {
        showMessage(`B 必須晚於 A（目前 A = ${fmt(t.a)}），且區段至少 ${MIN_SEGMENT} 秒。`, 'warn');
        return false;
      }
    }

    clearMessage();
    t[which] = v;
    state.playCount = 0;
    if (seg) {
      state.segments.sort((x, y) => x.a - y.a);
      saveStore();
    }
    renderAll();

    // 試聽：調 A 從 A 播，調 B 從 B 前一小段播
    if (preview && isPlaying()) {
      if (which === 'a') seek(t.a);
      else if (t.a != null) seek(Math.max(t.a, t.b - B_PREVIEW));
    }
    return true;
  }

  function markPoint(which) {
    if (!usable()) return;
    const ok = setPoint(which, state.player.getCurrentTime());
    // 標記 B 的當下已在 B 點，立即跳回 A
    if (ok && which === 'b' && loopActive() && isPlaying()) seek(editTarget().a);
  }

  function nudge(which, delta) {
    if (!usable()) return;
    const t = editTarget();
    if (t[which] == null) return;
    setPoint(which, t[which] + delta, { preview: true });
  }

  function commitTimeInput(which, input) {
    const t = editTarget();
    const v = parseTime(input.value);
    if (v == null) {
      showMessage('時間格式不正確，請輸入 mm:ss.s（例如 01:02.5）或秒數。', 'warn');
      input.value = t[which] == null ? '' : fmt(t[which]);
      return;
    }
    if (!setPoint(which, v, { preview: true })) {
      input.value = t[which] == null ? '' : fmt(t[which]);
    }
  }

  // ===== 區段操作 =====
  function saveDraftAsSegment() {
    const d = state.draft;
    if (d.a == null || d.b == null) return;
    const seg = { id: newId(), name: `區段 ${state.segments.length + 1}`, a: d.a, b: d.b, loops: 0 };
    state.segments.push(seg);
    state.segments.sort((x, y) => x.a - y.a);
    state.draft = { a: null, b: null };
    state.activeId = seg.id;
    state.playCount = 0;
    saveStore();
    clearMessage();
    renderAll();
    const input = el.segList.querySelector(`li[data-id="${seg.id}"] .name`);
    if (input) { input.focus(); input.select(); }
  }

  function playSegment(id) {
    const seg = state.segments.find(s => s.id === id);
    if (!seg || !state.playerReady) return;
    state.activeId = id;
    state.playCount = 0;
    seek(seg.a);
    if (!isPlaying()) state.player.playVideo();
    if (!state.loopEnabled) showMessage('循環目前已關閉，勾選「啟用循環」即可重複播放此區段。', 'info');
    else clearMessage();
    renderAll();
    const li = el.segList.querySelector(`li[data-id="${id}"]`);
    if (li && li.scrollIntoView) li.scrollIntoView({ block: 'nearest' });
  }

  function stepSegment(dir) {
    if (!state.segments.length) return;
    const idx = state.segments.findIndex(s => s.id === state.activeId);
    let next;
    if (idx < 0) next = dir > 0 ? 0 : state.segments.length - 1;
    else next = Math.min(Math.max(idx + dir, 0), state.segments.length - 1);
    playSegment(state.segments[next].id);
  }

  function deleteSegment(id) {
    const seg = state.segments.find(s => s.id === id);
    if (!seg) return;
    if (!confirm(`確定要刪除「${segLabel(seg)}」？`)) return;
    state.segments = state.segments.filter(s => s.id !== id);
    if (state.activeId === id) { state.activeId = null; state.playCount = 0; }
    saveStore();
    renderAll();
  }

  function startNewSegment() {
    state.activeId = null;
    state.draft = { a: null, b: null };
    state.playCount = 0;
    clearMessage();
    renderAll();
  }

  // ===== 播放速度 =====
  function applyRate() {
    if (!state.playerReady) return;
    try {
      if (state.player.getPlaybackRate() !== state.rate) state.player.setPlaybackRate(state.rate);
    } catch {}
  }
  function setRate(r) {
    if (!RATES.includes(r)) return;
    state.rate = r;
    el.rateSelect.value = String(r);
    lsSet(STORE_RATE, String(r));
    applyRate();
  }

  // ===== 播放器 =====
  function loadApi() {
    window.onYouTubeIframeAPIReady = () => {
      state.apiReady = true;
      if (state.videoId && !state.player) createPlayer(state.videoId);
    };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.async = true;
    s.onerror = () => showMessage('無法載入 YouTube 播放器。可能原因：網路連線中斷、被擋廣告外掛封鎖，或是在不允許外部腳本的預覽視窗中開啟（請下載檔案後用瀏覽器開啟）。');
    document.head.appendChild(s);
  }

  function createPlayer(videoId) {
    const playerVars = { playsinline: 1, rel: 0, modestbranding: 1 };
    if (/^https?:$/.test(location.protocol)) playerVars.origin = location.origin;

    state.player = new YT.Player('player', {
      videoId,
      playerVars,
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange,
        onPlaybackRateChange: onPlayerRateChange,
        onError: onPlayerError
      }
    });
  }

  function onPlayerReady() {
    state.playerReady = true;
    el.placeholder.hidden = true;
    const cur = (state.player.getVideoData() || {}).video_id;
    if (state.videoId && cur !== state.videoId) state.player.cueVideoById(state.videoId);
    applyRate();
    setStatus('影片已就緒，請點擊影片開始播放');
    renderControls();
  }

  function onPlayerStateChange(e) {
    const S = YT.PlayerState;
    switch (e.data) {
      case S.PLAYING:
        if (isMainVideoPlaying()) {
          if (el.msg.classList.contains('error')) clearMessage();
          applyRate(); // 換影片後速度可能被重設
          startPolling();
          updateLoopStatus();
        } else {
          stopPolling();
          setStatus('廣告播放中，正式影片開始後才會啟動循環');
        }
        break;
      case S.ENDED:
        stopPolling();
        // B 設在片尾附近時，輪詢可能來不及觸發
        if (loopActive()) {
          onReachB();
          if (state.player.getPlayerState() !== S.PAUSED) state.player.playVideo();
        } else {
          setStatus('播放結束');
        }
        break;
      case S.PAUSED:
        stopPolling();
        if (!/已播完/.test(el.status.textContent)) setStatus('已暫停');
        break;
      default: // BUFFERING、CUED、UNSTARTED
        stopPolling();
    }
  }

  // 使用者從 YouTube 齒輪選單改速度時同步
  function onPlayerRateChange(e) {
    const r = Number(e.data);
    if (RATES.includes(r) && r !== state.rate) {
      state.rate = r;
      el.rateSelect.value = String(r);
      lsSet(STORE_RATE, String(r));
    }
  }

  function onPlayerError(e) {
    stopPolling();
    showMessage(ERROR_TEXT[e.data] || `播放器發生未知錯誤（代碼 ${e.data}）。`);
    setStatus('無法播放此影片');
  }

  // ===== 載入影片 =====
  function loadVideo(videoId) {
    stopPolling();
    clearMessage();
    state.videoId = videoId;
    state.draft = { a: null, b: null };
    state.segments = loadStore(videoId);
    state.activeId = null;
    state.playCount = 0;
    lsSet(STORE_LAST, videoId);
    el.exportBox.hidden = true;
    renderControls();
    renderSegments();

    if (!state.apiReady) { setStatus('播放器載入中…'); return; }
    if (!state.player) {
      setStatus('播放器載入中…');
      createPlayer(videoId);
    } else if (state.playerReady) {
      // 用 cue 而非 load：不自動播放，手機上由使用者點擊開始
      state.player.cueVideoById(videoId);
      setStatus('影片已就緒，請點擊影片開始播放');
    }
  }

  // ===== 事件 =====
  el.form.addEventListener('submit', (e) => {
    e.preventDefault();
    const id = parseVideoId(el.input.value);
    if (!id) {
      showMessage('無法辨識這個網址。支援 watch?v=、youtu.be/、shorts/、embed/ 或 11 碼影片 ID。');
      return;
    }
    el.input.blur();
    loadVideo(id);
  });

  el.markA.addEventListener('click', () => markPoint('a'));
  el.markB.addEventListener('click', () => markPoint('b'));
  el.aMinus.addEventListener('click', () => nudge('a', -NUDGE));
  el.aPlus.addEventListener('click', () => nudge('a', +NUDGE));
  el.bMinus.addEventListener('click', () => nudge('b', -NUDGE));
  el.bPlus.addEventListener('click', () => nudge('b', +NUDGE));

  for (const [which, input] of [['a', el.aInput], ['b', el.bInput]]) {
    input.addEventListener('change', () => commitTimeInput(which, input));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { const t = editTarget(); input.value = t[which] == null ? '' : fmt(t[which]); input.blur(); }
    });
  }

  el.saveSeg.addEventListener('click', saveDraftAsSegment);
  el.newSeg.addEventListener('click', startNewSegment);

  el.clearAB.addEventListener('click', () => {
    state.draft = { a: null, b: null };
    state.playCount = 0;
    clearMessage();
    renderAll();
  });

  el.loopToggle.addEventListener('change', () => {
    state.loopEnabled = el.loopToggle.checked;
    state.playCount = 0;
    if (state.loopEnabled) clearMessage();
    updateLoopStatus();
  });

  el.rateSelect.addEventListener('change', () => setRate(Number(el.rateSelect.value)));

  el.exportBtn.addEventListener('click', openExport);
  el.copyBtn.addEventListener('click', copyExport);
  el.exportEnd.addEventListener('change', () => { el.exportText.value = buildChapterText(); });
  el.closeExport.addEventListener('click', () => { el.exportBox.hidden = true; });

  // ===== 快捷鍵 =====
  function isTypingTarget(node) {
    if (!node) return false;
    if (node.isContentEditable) return true;
    if (node.tagName === 'TEXTAREA' || node.tagName === 'SELECT') return true;
    if (node.tagName === 'INPUT') {
      return !['checkbox', 'radio', 'button', 'submit', 'range'].includes(node.type);
    }
    return false;
  }

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (isTypingTarget(e.target)) return;
    if (!usable()) return;

    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const actions = {
      'a': () => markPoint('a'),
      'b': () => markPoint('b'),
      ' ': () => (isPlaying() ? state.player.pauseVideo() : state.player.playVideo()),
      '[': () => nudge('a', -NUDGE),
      ']': () => nudge('a', +NUDGE),
      ',': () => nudge('b', -NUDGE),
      '.': () => nudge('b', +NUDGE),
      'ArrowUp': () => stepSegment(-1),
      'ArrowDown': () => stepSegment(+1)
    };
    const fn = actions[key];
    if (!fn) return;
    e.preventDefault();   // 避免 Space 捲動頁面 / 觸發按鈕、方向鍵捲動
    if (e.repeat && (key === 'a' || key === 'b' || key === ' ')) return;
    fn();
  });

  // 點了影片後鍵盤焦點會進到 iframe，頁面收不到按鍵：提示使用者
  window.addEventListener('blur', () => {
    setTimeout(() => {
      if (document.activeElement && document.activeElement.tagName === 'IFRAME' &&
          matchMedia('(hover: hover)').matches) {
        el.kbHint.hidden = false;
      }
    }, 0);
  });
  window.addEventListener('focus', () => { el.kbHint.hidden = true; });
  document.addEventListener('pointerdown', () => { el.kbHint.hidden = true; });

  // ===== 啟動 =====
  if (location.protocol === 'file:') {
    showMessage('偵測到以 file:// 開啟，YouTube 可能拒絕播放（錯誤 153）。建議在此資料夾執行 python3 -m http.server 後開啟 http://localhost:8000', 'warn');
  }
  const savedRate = Number(lsGet(STORE_RATE));
  if (RATES.includes(savedRate)) { state.rate = savedRate; el.rateSelect.value = String(savedRate); }

  renderControls();
  renderSegments();
  loadApi();

  const last = lsGet(STORE_LAST);
  if (last && ID_RE.test(last)) {
    el.input.value = 'https://youtu.be/' + last;
    loadVideo(last);
  }

  window.__ab = { state, parseVideoId, parseTime, fmt };
})();
</script>
</body>
</html>
